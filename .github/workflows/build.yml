name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不装 SDK:runner 镜像自带 Android SDK 且 ANDROID_HOME 已设好,缺的 platform
      # 由 AGP 自己下载。之前用 android-actions/setup-android@v3 会在它调用
      # runner 内 cmdline-tools/16.0/bin/sdkmanager 时 exit 1。
      - name: Build
        run: ./gradlew assembleDebug assembleRelease --no-daemon -Ppulse.outDir=artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: artifacts/*.apk
          if-no-files-found: error
