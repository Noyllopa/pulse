name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag，例如 v1.0.1-alpha.1
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 还原签名密钥
        env:
          PULSE_KEYSTORE: ${{ secrets.PULSE_KEYSTORE }}
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/pulse-release.jks"
          printf '%s' "$PULSE_KEYSTORE" | base64 -d > "$KS"
          # 只验证库能被口令打开、alias 确实在里面,不输出任何内容
          keytool -list -keystore "$KS" -storetype PKCS12 \
            -storepass "$PULSE_KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore "$KS" -storetype PKCS12 -alias "$PULSE_KEY_ALIAS" \
            -storepass "$PULSE_KEYSTORE_PASSWORD" >/dev/null \
            || { echo "::error::Secrets 里的 PULSE_KEY_ALIAS 在这个库中不存在"; exit 1; }
          {
            echo "storeFile=$KS"
            echo "storePassword=$PULSE_KEYSTORE_PASSWORD"
            echo "keyAlias=$PULSE_KEY_ALIAS"
            echo "keyPassword=$PULSE_KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: 构建并签名
        run: |
          set -eo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -Ppulse.outDir=dist \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # 日志正文要登录才看得到;提成 annotation 才能被未登录的 API 读到
      - name: 失败时抛出关键日志
        if: failure()
        run: |
          set -uo pipefail
          F="$RUNNER_TEMP/build.log"
          [ -f "$F" ] || { echo "::error::没有构建日志可提取"; exit 0; }
          grep -a -E "FAILURE:|What went wrong|^\* |^> |^e: |error:|Exception|Caused by" "$F" \
            | tail -18 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done

      - name: 校验产物确实被签名
        run: |
          set -euo pipefail
          APK=$(ls dist/*-release.apk)
          if [ -e dist/*-release-unsigned.apk ]; then
            echo "只产出了未签名包,说明 keystore.properties 没生效"; exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$OUT" | grep -a 'certificate DN'
          echo "$OUT" | grep -qa 'CN=pulse'
          ( cd dist && sha256sum *-release.apk > sha256.txt && cat sha256.txt )

      - name: 从 CHANGELOG 取发布说明
        run: |
          set -euo pipefail
          python3 - "${TAG#v}" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1]
          src = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          m = re.search(r'^## \[?%s\]?[^\n]*\n(.*?)(?=^## |\Z)' % re.escape(ver), src, re.S | re.M)
          # 章节末尾常跟着 [Unreleased]: https://… 这类链接定义,渲染出来是多余的一行
          lines = [l for l in (m.group(1).splitlines() if m else [])
                   if not re.match(r'^\[[^\]]+\]:\s+\S+\s*$', l)]
          body = '\n'.join(lines).strip()
          text = 'pulse %s\n\n%s\n\n安装前先看 README 的「已知限制」与「下载」。' % (ver, body)
          if not body:
              text = 'pulse %s' % ver
          pathlib.Path('release-notes.md').write_text(text, encoding='utf-8')
          print(text[:300])
          PY

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          # 重跑要无害:已发布过就到此为止,不报错也不重复建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在,跳过创建"
            exit 0
          fi
          ARGS=(--title "pulse $VER" --notes-file release-notes.md)
          case "$VER" in *-*) ARGS+=(--prerelease);; esac
          gh release create "$TAG" dist/*-release.apk dist/sha256.txt "${ARGS[@]}"
          echo "已发布 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
